<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="navbar">
        <h2><a href="index.html">MedAssist AI</a></h2>
        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="auth-box">
        <h2>Create your account</h2>
        <p class="sub-text">Register to use MedAssist AI</p>

        <div id="message" class="message"></div>

        <div class="tabs">
            <button type="button" class="tab active" data-role="patient">Patient</button>
            <button type="button" class="tab" data-role="doctor">Doctor</button>
            <button type="button" class="tab" data-role="clinic">Clinic</button>
        </div>
        <p id="roleNote" class="role-note hidden">Doctor and clinic accounts are approved by the admin. Until then you will have a patient account.</p>

        <form id="registerForm" novalidate>
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="contact">Contact Number</label>
            <input type="text" id="contact" placeholder="10 digit mobile number">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password">

            <div class="row">
                <div>
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Age">
                </div>
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="registerBtn">Register</button>
        </form>

        <p class="bottom-text">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
