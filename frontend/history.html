<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Medical History</h1>
        <p class="role-text">Your past medical records</p>

        <div id="message" class="message"></div>

        <div class="info-card">
            <h3>Add New Record</h3>
            <form id="historyForm" class="edit-form" novalidate>
                <label for="condition">Condition</label>
                <input type="text" id="condition" placeholder="Example: Typhoid fever, Fractured arm">

                <label for="recordDate">Date</label>
                <input type="date" id="recordDate">

                <label for="notes">Notes (optional)</label>
                <textarea id="notes" rows="3" placeholder="Medicines, doctor advice, etc."></textarea>

                <div class="form-buttons">
                    <button type="submit" id="addBtn">Add Record</button>
                </div>
            </form>
        </div>

        <h3 class="list-title">Your Records</h3>
        <div id="historyList" class="history-list"></div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
