<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard">
        <h1>My Profile</h1>
        <p class="role-text">Role: <span id="roleText"></span></p>

        <div id="message" class="message"></div>

        <div id="viewBox" class="info-card">
            <h3>Personal Details</h3>
            <table>
                <tr><td>Full Name</td><td id="infoName"></td></tr>
                <tr><td>Email</td><td id="infoEmail"></td></tr>
                <tr><td>Age</td><td id="infoAge"></td></tr>
                <tr><td>Gender</td><td id="infoGender"></td></tr>
                <tr><td>Contact</td><td id="infoContact"></td></tr>
                <tr><td>Member Since</td><td id="infoJoined"></td></tr>
            </table>
            <button id="editBtn" class="edit-btn">Edit Profile</button>
        </div>

        <div id="editBox" class="info-card hidden">
            <h3>Edit Profile</h3>
            <form id="profileForm" class="edit-form" novalidate>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName">

                <label for="email">Email (cannot be changed)</label>
                <input type="email" id="email" disabled>

                <div class="row">
                    <div>
                        <label for="age">Age</label>
                        <input type="number" id="age">
                    </div>
                    <div>
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <label for="contact">Contact Number</label>
                <input type="text" id="contact" placeholder="10 digit mobile number">

                <div class="form-buttons">
                    <button type="submit" id="saveBtn">Save Changes</button>
                    <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
