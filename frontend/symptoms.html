<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Analysis - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/symptoms.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <a href="assessments.html">My Assessments</a>
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard wide">
        <h1>Symptom Analysis</h1>
        <p class="role-text">Select all the symptoms you are experiencing right now</p>

        <div id="message" class="message"></div>

        <div class="info-card">
            <h3>Common Symptoms</h3>
            <div id="commonList" class="chip-area"></div>
        </div>

        <div class="info-card gap">
            <h3>Search Symptoms</h3>
            <input type="text" id="searchBox" class="search-input" placeholder="Type to search, for example: head">
            <div id="symptomList" class="chip-area scroll-area"></div>
            <p id="noMatch" class="empty-text hidden">No matching symptoms found.</p>
        </div>

        <div class="info-card gap">
            <h3>Selected Symptoms (<span id="selectedCount">0</span>)</h3>
            <div id="selectedList" class="chip-area"></div>
            <p id="noSelected" class="empty-text">No symptoms selected yet.</p>

            <div class="form-buttons">
                <button type="button" id="submitBtn">Submit Symptoms</button>
                <button type="button" id="clearBtn" class="cancel-btn">Clear All</button>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/symptoms.js"></script>
</body>
</html>
