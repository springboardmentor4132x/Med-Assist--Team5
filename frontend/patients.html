<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard wide">
        <h1>My Patients</h1>
        <p class="role-text">Patients assigned to you by the admin</p>

        <div id="message" class="message"></div>

        <div class="table-wrap">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="patientTable"></tbody>
            </table>
        </div>
        <p id="noPatients" class="empty-text hidden">No patients are assigned to you yet.</p>

        <div id="detailBox" class="hidden">
            <h3 class="list-title">History of <span id="patientName"></span></h3>
            <div id="patientInfo" class="patient-info"></div>
            <div id="historyList" class="history-list"></div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/patients.js"></script>
</body>
</html>
