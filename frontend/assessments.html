<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assessments - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/assessment.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <a href="symptoms.html">New Assessment</a>
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard wide">
        <h1>My Assessments</h1>
        <p class="role-text">Your past symptom assessments</p>

        <div id="message" class="message"></div>

        <div id="tableWrap" class="table-wrap hidden">
            <table class="user-table wrap-text">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Date (UTC)</th>
                        <th>Symptoms</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="assessmentTable"></tbody>
            </table>
        </div>

        <div id="noAssessments" class="hidden">
            <p class="empty-text">You have not done any assessment yet.</p>
            <p class="bottom-buttons"><a href="symptoms.html" class="btn">Start Your First Assessment</a></p>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/assessments.js"></script>
</body>
</html>
