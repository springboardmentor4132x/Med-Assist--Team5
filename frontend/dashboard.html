<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MedAssist AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <h2>MedAssist AI</h2>
        <nav>
            <span id="navName"></span>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard">
        <div id="message" class="message"></div>

        <h1 id="welcomeText">Dashboard</h1>
        <p class="role-text">Logged in as: <span id="roleText"></span></p>

        <div id="roleLinks" class="link-grid"></div>

        <div class="info-card">
            <h3>Your Details</h3>
            <table>
                <tr><td>Full Name</td><td id="infoName"></td></tr>
                <tr><td>Email</td><td id="infoEmail"></td></tr>
                <tr><td>Age</td><td id="infoAge"></td></tr>
                <tr><td>Gender</td><td id="infoGender"></td></tr>
                <tr><td>Contact</td><td id="infoContact"></td></tr>
            </table>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
