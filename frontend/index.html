<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedAssist AI - Risk Categorization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Risk Categorization</h1>
    <p class="note">Preliminary automated estimate. Not a medical diagnosis.</p>

    <form id="risk-form" novalidate>
      <label>Risk score (0-100)
        <input id="risk_score" type="number" min="0" max="100" step="any" required>
      </label>

      <label>Severity level (from Severity Evaluation)
        <select id="severity_level">
          <option value="">Not provided</option>
          <option>LOW</option><option>MODERATE</option>
          <option>HIGH</option><option>CRITICAL</option>
        </select>
      </label>

      <label class="inline">
        <input id="emergency_flag" type="checkbox">
        Emergency flag (from Emergency Identification)
      </label>

      <label>Symptoms (comma separated, optional)
        <input id="symptoms" type="text" placeholder="fever, headache">
      </label>

      <label>Risk factors (comma separated, optional)
        <input id="risk_factors" type="text" placeholder="persistent symptoms">
      </label>

      <button type="submit">Categorize risk</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" hidden aria-live="polite">
      <div id="emergency-banner" class="emergency" hidden></div>
      <div class="summary">
        <div>Risk Score: <strong id="out-score"></strong></div>
        <div>Risk Category: <span id="out-category" class="badge"></span></div>
        <div>Severity: <strong id="out-severity"></strong></div>
        <div>Emergency Warning: <strong id="out-emergency"></strong></div>
      </div>
      <h2>Explanation</h2>
      <p id="out-explanation"></p>
      <h2>Guidance</h2>
      <p id="out-guidance"></p>
      <h2>Contributing factors</h2>
      <ul id="out-factors"></ul>
      <p id="out-disclaimer" class="note"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
